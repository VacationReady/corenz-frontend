name: Dependency Hygiene Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for unused dependencies
        run: |
          npx depcheck --ignores="@types/*,autoprefixer,postcss,tailwindcss,eslint*,@typescript-eslint/*,ts-node,tsx,prisma,typescript"
          if [ $? -ne 0 ]; then
            echo "❌ Unused dependencies detected. Run 'npx depcheck' locally and remove them."
            exit 1
          fi
      
      - name: Run linting
        run: npm run lint
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Run tests
        run: npm test
