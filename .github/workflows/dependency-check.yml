name: Dependency Hygiene Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Check for unused dependencies
        run: |
          npx depcheck --ignores="@types/*,autoprefixer,postcss,tailwindcss,eslint*,@typescript-eslint/*,ts-node,tsx,prisma,typescript,preact"
          if [ $? -ne 0 ]; then
            echo "❌ Unused dependencies detected. Run 'npx depcheck' locally and remove them."
            exit 1
          fi
      
      - name: Run linting
        run: npm run lint
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Run tests
        run: npm test

  timesheet-tenant-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: peoplecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d peoplecore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/peoplecore_test
      SKIP_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database schema (security tests)
        run: npx prisma db push

      - name: Run tenant isolation security tests
        run: npm test -- tests/security/timesheet-tenant-isolation.test.ts
